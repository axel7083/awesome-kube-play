apiVersion: v1
kind: Pod
metadata:
  name: fastapi
spec:
  containers:
    - image: app
      name: fastapi
      ports:
        - containerPort: 80
          hostPort: 8000
      # Optional health check
      livenessProbe:
        httpGet:
          path: /
          port: 8000
        initialDelaySeconds: 5 # default is 0
        periodSeconds: 30 # default is 10
