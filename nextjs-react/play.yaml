apiVersion: v1
kind: Pod
metadata:
  name: nextjs-react
spec:
  containers:
    - image: app
      name: nextjs-react
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 5 # default is 0
        periodSeconds: 30 # default is 10
